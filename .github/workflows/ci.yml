name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  ci:
    uses: eirvandelden/appkit/.github/workflows/rails-ci.yml@main
    with:
      run_system_tests: false

  # Catches gems that install fine but only break when a production boot
  # actually loads their code (see config/environments/production.rb).
  boot_production:
    name: Boot production environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current
          install-gems: true
      - name: Boot in production mode
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ci-boot-check
        run: bin/rails runner "puts 'Booted ' + Rails.env"
