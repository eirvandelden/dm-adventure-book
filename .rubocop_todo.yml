# This configuration was generated by
# `rubocop --auto-gen-config`, then hand-edited to exclude specific files
# instead of loosening the rule everywhere:
#
# - config/initializers/alchemy.rb and devise.rb are gem-generated template
#   comments (from `rails g alchemy:install` / Devise's own installer), not
#   our prose.
# - db/migrate/*.alchemy.rb are copied verbatim from the alchemy_cms gem via
#   `rails alchemy:install:migrations`.
# - db/seeds/alchemy/legacy_content.rb holds real 2019 campaign writing
#   recovered from a Postgres backup; wrapping it would mean manually
#   splitting someone's prose mid-sentence.

Metrics/BlockLength:
  Exclude:
    - 'db/migrate/*.alchemy.rb'

Layout/LineLength:
  Exclude:
    - 'config/initializers/alchemy.rb'
    - 'config/initializers/devise.rb'
    - 'db/seeds/alchemy/legacy_content.rb'
